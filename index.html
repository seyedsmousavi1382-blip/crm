<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14232e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مشتری‌ها">
<link rel="apple-touch-icon" id="ico">
<title>مشتری‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232e;--bg:#eef2f4;--card:#fff;--line:#dbe3e8;--acc:#0e7c7b;--mut:#62737f;--warn:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:#fff}
header b{font-weight:800;font-size:18px}
header button{background:none;border:0;color:#fff;padding:4px}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow:auto;padding:12px 12px 90px}
.view[hidden],#sheet[hidden],#dp[hidden],#banner[hidden],#add[hidden],#loc[hidden]{display:none}
#v-map{padding:0;overflow:hidden}
#map{position:absolute;inset:0;direction:ltr}
.pin{background:none;border:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
nav button.on{color:var(--acc);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#add{position:absolute;z-index:1200;left:14px;bottom:14px;background:var(--ink);color:#fff;border:0;font-weight:600;padding:13px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#loc{position:absolute;z-index:1200;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.3);color:#2f6bff}
#loc svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
#banner{position:absolute;z-index:1300;top:10px;left:10px;right:10px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#banner button{background:#fff;border:0;border-radius:8px;padding:4px 12px}
.srch{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:8px;margin:10px 0}
.chips button,.seg button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px}
.chips button.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cd{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:9px;border-right:5px solid var(--c,#999);cursor:pointer}
.cd .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cd b{font-weight:600;font-size:16px}
.cd small{color:var(--mut);display:block;margin-top:2px}
.due{color:var(--warn);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:36px 12px;line-height:1.9}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dn button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.dn .d{flex:1;font-weight:600}
.sum{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between}
#sheet,#dp{position:fixed;inset:0;z-index:2000;background:rgba(10,20,27,.55);display:flex;align-items:flex-end;justify-content:center}
#dp{z-index:3000;align-items:center}
#sb{background:#fff;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#dpb{background:#fff;width:min(340px,92%);border-radius:18px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;font-size:20px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%}
#sb label{display:block;color:var(--mut);font-size:13px;margin-top:11px}
#sb input,#sb textarea{display:block;width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;display:inline-block;text-decoration:none}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dt{width:100%;text-align:right;margin-top:4px}
h3{margin:20px 0 6px;font-size:15px}
.or{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.or>div{flex:1}.or small{display:block;color:var(--mut)}
.or button{border:0;background:none;color:var(--warn)}
.add{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:6px;margin-top:8px}
.add input{margin:0!important}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dh button,.df button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 14px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dg i{font-style:normal;color:var(--mut);font-size:12px;padding:4px 0}
.dg button{border:0;background:none;padding:9px 0;border-radius:9px}
.dg .tod{outline:1px solid var(--acc)}
.dg .sel{background:var(--acc);color:#fff}
.df{display:flex;gap:6px;justify-content:space-between;margin-top:10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><b>مشتری‌ها</b><button data-a="set" aria-label="تنظیمات"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></header>
<main>
  <section class="view" id="v-map"><div id="map"></div><div id="banner" hidden><span>روی نقشه ضربه بزن تا موقعیت ثبت شود.</span><button data-a="bc">انصراف</button></div></section>
  <section class="view" id="v-cust" hidden>
    <input class="srch" id="q" type="search" placeholder="جستجوی نام یا تلفن">
    <div class="chips"><button data-f="all" class="on">همه</button><button data-f="due" id="fdue">پیگیری امروز</button></div>
    <div id="items"></div>
  </section>
  <section class="view" id="v-ord" hidden><div id="days"></div></section>
  <button id="add">+ مشتری جدید</button>
  <button id="loc" aria-label="موقعیت من"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</main>
<nav>
  <button data-t="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>نقشه</button>
  <button data-t="cust"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.500-6s6 2 6.500 6M16 4.500a3.500 3.500 0 0 1 0 7M18 14c2 .7 3.200 2.700 3.500 6"/></svg>مشتری‌ها</button>
  <button data-t="ord"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>سفارش‌ها</button>
</nav>
<div id="sheet" hidden><div id="sb"></div></div>
<div id="dp" hidden><div id="dpb"></div></div>

<script>
const $=s=>document.querySelector(s),MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const pd=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),fa=n=>(+n||0).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ST={new:['جدید','#2563eb'],talk:['در حال مذاکره','#d97706'],buyer:['خریدار','#15803d'],cold:['سرد‌شده','#6b7280']};
/* تقویم شمسی */
const P=n=>parseInt(n);
function g2j(gy,gm,gd){const m=[0,31,59,90,120,151,181,212,243,273,304,334];gy-=1600;let jy=979,g2=gm>2?gy+1:gy,d=365*gy+P((g2+3)/4)-P((g2+99)/100)+P((g2+399)/400)-80+gd+m[gm-1];jy+=33*P(d/12053);d%=12053;jy+=4*P(d/1461);d%=1461;if(d>365){jy+=P((d-1)/365);d=(d-1)%365}return[jy,d<186?1+P(d/31):7+P((d-186)/30),1+(d<186?d%31:(d-186)%30)]}
function j2g(jy,jm,jd){jy-=979;let gy=621,d=365*jy+P(jy/33)*8+P(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*P(d/146097);d%=146097;if(d>36524){gy+=100*P(--d/36524);d%=36524;if(d>=365)d++}gy+=4*P(d/1461);d%=1461;if(d>365){gy+=P((d-1)/365);d=(d-1)%365}let gd=d+1,s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31],gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ymd=s=>s.split('-').map(Number);
const today=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fd=s=>{if(!s)return'—';const[y,m,d]=g2j(...ymd(s));return`${pd(d)} ${MN[m-1]} ${pd(y)}`};
const sh=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const mlen=(y,m)=>{if(m<7)return 31;if(m<12)return 30;const r=g2j(...j2g(y,12,30));return r[0]===y&&r[1]===12?30:29};
let dpCb,dpY,dpM,dpSel,dpClr;
function pickDate(sel,cb,clr){dpCb=cb;dpSel=sel||today();[dpY,dpM]=g2j(...ymd(dpSel));dpClr=clr;dpDraw();$('#dp').hidden=false}
function dpDraw(){
  const[a,b,c]=j2g(dpY,dpM,1),off=(new Date(a,b-1,c).getDay()+1)%7,t=today();
  let h=`<div class="dh"><button data-m="-1">›</button><b>${MN[dpM-1]} ${pd(dpY)}</b><button data-m="1">‹</button></div><div class="dg">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<i>${x}</i>`).join('')}${'<span></span>'.repeat(off)}`;
  for(let d=1;d<=mlen(dpY,dpM);d++){const s=iso(...j2g(dpY,dpM,d));h+=`<button data-d="${s}" class="${s===dpSel?'sel':''} ${s===t?'tod':''}">${pd(d)}</button>`}
  $('#dpb').innerHTML=h+`</div><div class="df"><button data-d="${t}">امروز</button>${dpClr?'<button data-d="">بدون تاریخ</button>':''}<button data-d="x">بستن</button></div>`;
}
$('#dpb').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m){dpM+=+b.dataset.m;if(dpM<1){dpM=12;dpY--}if(dpM>12){dpM=1;dpY++}dpDraw();return}
  if(b.dataset.d===undefined)return;$('#dp').hidden=true;if(b.dataset.d!=='x')dpCb(b.dataset.d)};
$('#dp').onclick=e=>{if(e.target.id==='dp')$('#dp').hidden=true};
/* داده */
let db=[],tab='map',flt='all',odate=today(),draft=null,isNew=false,pick=false,odd=today(),gps=null,map,layer,meD,meA;
try{db=JSON.parse(localStorage.getItem('crm1')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('crm1',JSON.stringify(db))}catch(e){alert('ذخیره‌سازی ممکن نشد؛ بکاپ بگیر.')}};
const tot=c=>c.orders.reduce((s,o)=>s+o.q*o.p,0);
const upsert=c=>{const i=db.findIndex(x=>x.id==c.id);i<0?db.push(JSON.parse(JSON.stringify(c))):db[i]=JSON.parse(JSON.stringify(c));save()};
/* نقشه */
const loadJS=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const loadCSS=u=>{const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l)};
async function initMap(){
  const key=localStorage.getItem('crm_key');
  if(key)try{loadCSS('https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.css');await loadJS('https://static.neshan.org/sdk/leaflet/1.4.0/leaflet.js');map=new L.Map('map',{key,maptype:'dreamy',poi:true,traffic:false,center:[34.64,50.88],zoom:13})}catch(e){map=null}
  if(!map){if(!window.L){loadCSS('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css');await loadJS('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')}
    map=L.map('map',{zoomControl:false}).setView([34.64,50.88],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
  layer=L.layerGroup().addTo(map);
  map.on('click',e=>{if(!pick)return;pick=false;$('#banner').hidden=true;draft.lat=e.latlng.lat;draft.lng=e.latlng.lng;sheet()});
  render();const pts=db.filter(c=>c.lat!=null).map(c=>[c.lat,c.lng]);if(pts.length)map.fitBounds(pts,{padding:[50,50],maxZoom:15});
  watch();
}
function watch(){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{
  const ll=[p.coords.latitude,p.coords.longitude],first=!gps;gps=ll;
  if(!meD){meA=L.circle(ll,{radius:p.coords.accuracy,weight:0,fillColor:'#2f6bff',fillOpacity:.15,interactive:false}).addTo(map);meD=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2f6bff',fillOpacity:1,interactive:false}).addTo(map)}
  else{meA.setLatLng(ll).setRadius(p.coords.accuracy);meD.setLatLng(ll)}
  if(first&&!db.some(c=>c.lat!=null))map.setView(ll,15)},()=>{},{enableHighAccuracy:true,maximumAge:5000})}
$('#loc').onclick=()=>gps?map.setView(gps,16):alert('موقعیت هنوز پیدا نشده. اجازه‌ی دسترسی به موقعیت را در مرورگر بررسی کن.');
const pin=col=>L.divIcon({className:'pin',iconSize:[30,40],iconAnchor:[15,40],html:`<svg viewBox="0 0 24 32" width="30" height="40"><path d="M12 1C5.900 1 1 5.800 1 11.700 1 19.500 12 31 12 31s11-11.500 11-19.300C23 5.800 18.100 1 12 1z" fill="${col}" stroke="#fff" stroke-width="2"/><circle cx="12" cy="11.500" r="4.200" fill="#fff"/></svg>`});
/* نمایش */
function render(){
  const t=today(),due=db.filter(c=>c.fu&&c.fu<=t);
  if(layer){layer.clearLayers();db.forEach(c=>{if(c.lat!=null)L.marker([c.lat,c.lng],{icon:pin(ST[c.st][1])}).addTo(layer).on('click',()=>openC(c.id))})}
  $('#fdue').textContent='پیگیری امروز'+(due.length?` (${fa(due.length)})`:'');
  const q=$('#q').value.trim();let rows=flt==='due'?due:db;if(q)rows=rows.filter(c=>(c.name+c.ph).includes(q));
  rows=[...rows].sort((a,b)=>(a.fu||'9')>(b.fu||'9')?1:-1);
  $('#items').innerHTML=rows.map(c=>{const l=[...c.orders].sort((a,b)=>b.d>a.d?1:-1)[0];
    return`<div class="cd" data-id="${c.id}" style="--c:${ST[c.st][1]}"><div class="r"><b>${esc(c.name)}</b><span>${ST[c.st][0]}</span></div><small>${esc(c.ph)}</small><small>${l?`آخرین سفارش: ${fd(l.d)} — جمع خرید: ${fa(tot(c))} تومان`:'بدون سفارش'}</small>${c.fu?`<small class="${c.fu<=t?'due':''}">پیگیری: ${fd(c.fu)}</small>`:''}</div>`}).join('')
    ||`<p class="empty">${flt==='due'?'برای امروز پیگیری‌ای نیست.':'هنوز مشتری‌ای ثبت نشده.<br>با دکمه‌ی «مشتری جدید» اولی را اضافه کن.'}</p>`;
  const os=db.flatMap(c=>c.orders.filter(o=>o.d===odate).map(o=>({c,o}))),sum=os.reduce((s,x)=>s+x.o.q*x.o.p,0);
  $('#days').innerHTML=`<div class="dn"><button data-a="dp">›</button><button class="d" data-a="dk">${WD[new Date(odate+'T12:00:00').getDay()]} ${fd(odate)}</button><button data-a="dn">‹</button></div>
  <div class="sum"><span>${fa(os.length)} سفارش</span><b>${fa(sum)} تومان</b></div>`
  +(os.map(({c,o})=>`<div class="cd" data-id="${c.id}" style="--c:${ST[c.st][1]}"><div class="r"><b>${esc(c.name)}</b><span>${fa(o.q*o.p)} تومان</span></div><small>${esc(o.i)}: ${fa(o.q)} × ${fa(o.p)}</small></div>`).join('')||'<p class="empty">در این روز سفارشی ثبت نشده.</p>');
}
function setTab(t){tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['map','cust','ord'].forEach(v=>$('#v-'+v).hidden=v!==t);
  $('#add').hidden=t==='ord';$('#loc').hidden=t!=='map';
  if(t==='map'&&map)setTimeout(()=>map.invalidateSize(),50);render()}
/* برگه‌ی مشتری */
const openC=id=>{draft=JSON.parse(JSON.stringify(db.find(c=>c.id==id)));isNew=false;sheet()};
const newC=()=>{draft={id:Date.now(),name:'',ph:'',ad:'',st:'new',fu:'',nt:'',lat:null,lng:null,orders:[]};isNew=true;sheet()};
function readForm(){if(!$('#fn'))return;draft.name=$('#fn').value.trim();draft.ph=$('#fp').value.trim();draft.ad=$('#fa').value.trim();draft.nt=$('#fnt').value}
function sheet(){
  const c=draft,os=c.orders.map((o,i)=>({...o,i})).sort((a,b)=>b.d>a.d?1:-1);
  $('#sheet').hidden=false;
  $('#sb').innerHTML=`<div class="top"><h2>${isNew?'مشتری جدید':esc(c.name)}</h2><button class="x" data-a="cl">✕</button></div>
  ${!isNew?`<div class="row">${c.ph?`<a class="btn pri" href="tel:${esc(c.ph)}">تماس</a>`:''}${c.lat!=null?`<a class="btn pri" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}">مسیریابی</a>`:''}</div>`:''}
  <label>نام<input id="fn" value="${esc(c.name)}"></label>
  <label>تلفن<input id="fp" type="tel" inputmode="tel" value="${esc(c.ph)}"></label>
  <label>آدرس<input id="fa" value="${esc(c.ad)}"></label>
  <label>موقعیت روی نقشه: ${c.lat!=null?'ثبت شده':'ثبت نشده'}</label>
  <div class="row" style="margin-top:4px"><button class="btn" data-a="gps">موقعیت فعلی من</button><button class="btn" data-a="pk">انتخاب روی نقشه</button></div>
  <label>وضعیت</label><div class="seg">${Object.entries(ST).map(([k,v])=>`<button data-s="${k}" class="${k===c.st?'on':''}">${v[0]}</button>`).join('')}</div>
  <label>پیگیری بعدی</label><button class="btn dt" data-a="fu">${c.fu?fd(c.fu):'انتخاب تاریخ'}</button>
  <label>یادداشت<textarea id="fnt" rows="2">${esc(c.nt)}</textarea></label>
  <h3>سفارش‌ها (جمع خرید: ${fa(tot(c))} تومان)</h3>
  ${os.map(o=>`<div class="or"><div><b>${esc(o.i)}</b><small>${fd(o.d)}</small></div><span>${fa(o.q)} × ${fa(o.p)}</span><button data-a="od" data-i="${o.i}">حذف</button></div>`).join('')||'<small style="color:var(--mut)">سفارشی ثبت نشده.</small>'}
  <div class="add"><input id="oi" placeholder="محصول"><input id="oq" type="number" inputmode="numeric" placeholder="تعداد"><input id="op" type="number" inputmode="numeric" placeholder="قیمت واحد"></div>
  <div class="row"><button class="btn" data-a="odt">تاریخ: ${fd(odd)}</button><button class="btn pri" data-a="oa">ثبت سفارش</button></div>
  <div class="row" style="margin-top:20px"><button class="btn pri" data-a="sv" style="flex:1">ذخیره</button>${!isNew?'<button class="btn" data-a="dl" style="color:var(--warn)">حذف مشتری</button>':''}</div>`;
}
$('#sb').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){readForm();draft.st=b.dataset.s;sheet();return}
  const a=b.dataset.a;if(!a)return;
  const need=()=>{readForm();if(!draft.name){alert('نام مشتری را وارد کن.');return false}return true};
  if(a==='cl'){$('#sheet').hidden=true}
  if(a==='fu'){readForm();pickDate(draft.fu,d=>{draft.fu=d;sheet()},true)}
  if(a==='odt'){readForm();pickDate(odd,d=>{odd=d||today();sheet()})}
  if(a==='od'){readForm();draft.orders.splice(+b.dataset.i,1);if(!isNew||draft.name)upsert(draft);render();sheet()}
  if(a==='oa'){const i=$('#oi').value.trim(),q=+$('#oq').value,p=+$('#op').value;
    if(!i||!q){alert('نام محصول و تعداد را وارد کن.');return}
    if(!need())return;draft.orders.push({i,q,p,d:odd});upsert(draft);isNew=false;render();sheet()}
  if(a==='gps'){readForm();if(!gps){alert('موقعیت هنوز پیدا نشده؛ چند ثانیه صبر کن یا روی نقشه انتخاب کن.');return}draft.lat=gps[0];draft.lng=gps[1];sheet()}
  if(a==='pk'){readForm();$('#sheet').hidden=true;pick=true;$('#banner').hidden=false;setTab('map')}
  if(a==='sv'){if(!need())return;upsert(draft);$('#sheet').hidden=true;render()}
  if(a==='dl'&&confirm('این مشتری و سفارش‌هایش حذف شود؟')){db=db.filter(c=>c.id!=draft.id);save();$('#sheet').hidden=true;render()}
  if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));l.download='customers-'+today()+'.json';l.click()}
  if(a==='key'){const k=$('#nk').value.trim();k?localStorage.setItem('crm_key',k):localStorage.removeItem('crm_key');location.reload()}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true});
$('#sheet').addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f||!confirm('اطلاعات فعلی با بکاپ جایگزین شود؟'))return;
  f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;db=d;save();render();$('#sheet').hidden=true}).catch(()=>alert('فایل بکاپ معتبر نیست.'))});
function settings(){$('#sheet').hidden=false;
  $('#sb').innerHTML=`<div class="top"><h2>تنظیمات</h2><button class="x" data-a="cl">✕</button></div>
  <label>کلید نقشه‌ی نشان (از platform.neshan.org، نوع Web، بدون محدودیت دامنه)<input id="nk" dir="ltr" value="${esc(localStorage.getItem('crm_key')||'')}" placeholder="web.xxxxxxxx"></label>
  <div class="row"><button class="btn pri" data-a="key">ذخیره‌ی کلید</button></div>
  <h3>بکاپ</h3><div class="row"><button class="btn" data-a="exp">گرفتن بکاپ</button><label class="btn" style="margin:0">بازگردانی بکاپ<input id="imp" type="file" accept=".json" hidden></label></div>`}
/* رویدادها */
document.querySelector('header').onclick=e=>{if(e.target.closest('[data-a=set]'))settings()};
$('#banner').onclick=e=>{if(e.target.closest('[data-a=bc]')){pick=false;$('#banner').hidden=true;sheet()}};
$('#days').onclick=e=>{const b=e.target.closest('button'),r=e.target.closest('.cd');
  if(r){openC(r.dataset.id);return}if(!b)return;
  if(b.dataset.a==='dp'){odate=sh(odate,-1);render()}
  if(b.dataset.a==='dn'){odate=sh(odate,1);render()}
  if(b.dataset.a==='dk')pickDate(odate,d=>{odate=d||today();render()})};
$('#items').onclick=e=>{const r=e.target.closest('.cd');if(r)openC(r.dataset.id)};
document.querySelector('.chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.f||'due';
  document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#q').oninput=render;$('#add').onclick=newC;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#14232e';g.fillRect(0,0,180,180);g.fillStyle='#fff';g.beginPath();g.moveTo(90,28);g.bezierCurveTo(58,28,40,52,40,76);g.bezierCurveTo(40,110,90,152,90,152);g.bezierCurveTo(90,152,140,110,140,76);g.bezierCurveTo(140,52,122,28,90,28);g.fill();g.fillStyle='#0e7c7b';g.beginPath();g.arc(90,76,18,0,7);g.fill();$('#ico').href=c.toDataURL()})();
setTab('map');initMap();
</script>
</body>
</html>
